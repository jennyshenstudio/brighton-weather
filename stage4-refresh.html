<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brighton Weather - Stage 4</title>
</head>
<body>
  <h1>Weather in <span id="town"></span></h1>

  <p>Forecast URL: <a id="url-link" href="#" target="_blank" rel="noopener"></a></p>

  <p>Weather: <span id="weather-code"></span></p>
  <p>Temperature: <span id="temperature"></span></p>
  <p>Time: <span id="time"></span></p>

  <p id="message"></p>

  <button id="refresh-button">Refresh data</button>

  <p>Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a></p>

  <script>
    // Settings for the page, kept in one place.
    // Open-Meteo needs no key, but this is where a key would go.
    // (A key in a web page can still be seen in DevTools, so real secret keys need a server.)
    const CONFIG = {
      town: "Brighton",
      latitude: 50.8284,
      longitude: -0.1395
      // apiKey: "your-key-here"
    };

    // Builds the Open-Meteo forecast URL by joining strings with +.
    function buildUrl() {
      return "https://api.open-meteo.com/v1/forecast" +
        "?latitude=" + CONFIG.latitude +
        "&longitude=" + CONFIG.longitude +
        "&current=temperature_2m,weather_code,wind_speed_10m" +
        "&timezone=Europe%2FLondon";
    }

    // Shows the town name and the URL (as a link) on the page.
    function showSetup() {
      const url = buildUrl();
      document.getElementById("town").textContent = CONFIG.town;

      const link = document.getElementById("url-link");
      link.href = url;
      link.textContent = url;
    }

    // Turns a date like 2026-10-28T12:45 into 28/10/2026 12:45.
    // split cuts a string into pieces at a chosen character.
    function formatDate(isoText) {
      const parts = isoText.split("T");        // ["2026-10-28", "12:45"]
      const dateParts = parts[0].split("-");   // ["2026", "10", "28"]
      return dateParts[2] + "/" + dateParts[1] + "/" + dateParts[0] + " " + parts[1];
    }

    // Turns a weather code number into words.
    function describeWeather(code) {
      if (code === 0) {
        return "Clear sky";
      } else if (code >= 1 && code <= 3) {
        return "Cloudy";
      } else if (code >= 45 && code <= 48) {
        return "Fog";
      } else if (code >= 51 && code <= 67) {
        return "Rain";
      } else if (code >= 71 && code <= 77) {
        return "Snow";
      } else if (code >= 80 && code <= 82) {
        return "Rain showers";
      } else if (code >= 95) {
        return "Thunderstorm";
      } else {
        return "Unknown";
      }
    }

    // Picks the weather code, temperature and time out of the data and shows each one,
    // using describeWeather and formatDate to make them easy to read.
    function showWeather(data) {
      document.getElementById("weather-code").textContent = describeWeather(data.current.weather_code);
      document.getElementById("temperature").textContent = data.current.temperature_2m + "°C";
      document.getElementById("time").textContent = formatDate(data.current.time);
    }

    // Fetches the weather and passes it to showWeather.
    // "try" runs the risky steps; if any fails, "catch" shows an error message instead.
    async function loadWeather() {
      const message = document.getElementById("message");
      message.textContent = "";

      try {
        const response = await fetch(buildUrl());
        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }
        const data = await response.json();
        showWeather(data);
      } catch (error) {
        message.textContent = "Could not load the weather.";
        console.error(error);
      }
    }

    // The button calls the same loadWeather function (no copy).
    document.getElementById("refresh-button").addEventListener("click", loadWeather);

    // Run when the page loads.
    showSetup();
    loadWeather();
  </script>
</body>
</html>
